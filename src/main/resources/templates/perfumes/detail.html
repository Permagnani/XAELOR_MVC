<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Detalhe do perfume')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main>
  <a th:href="@{/perfumes}" class="btn btn-ghost btn-sm">&larr; Voltar</a>

  <div class="xa-detail">
    <span class="tag" th:text="${perfume.generoPerfume}">Gênero</span>
    <h2 th:text="${perfume.nomePerfume}">Nome</h2>
    <dl>
      <dt>ID</dt><dd th:text="${perfume.id}">1</dd>
      <dt>Gênero</dt><dd th:text="${perfume.generoPerfume}">-</dd>
      <dt>Descrição</dt><dd th:text="${perfume.descricaoPerfume} ?: '—'">-</dd>
      <dt>Preço</dt>
      <dd th:text="${perfume.preco != null} ? 'R$ ' + ${#numbers.formatDecimal(perfume.preco, 1, 2)} : '—'">-</dd>
    </dl>
    <div class="xa-form-actions" sec:authorize="isAuthenticated()">
      <a th:href="@{/perfumes/{id}/editar(id=${perfume.id})}" class="btn btn-ghost">Editar</a>
      <form th:action="@{/perfumes/{id}/deletar(id=${perfume.id})}" method="post"
            onsubmit="return confirm('Remover este perfume?');">
        <button type="submit" class="btn btn-wine">Excluir</button>
      </form>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
