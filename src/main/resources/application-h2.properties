# ------------------------------------------------------------------
# Perfil alternativo com banco H2 em memória.
# Útil para o Deploy em plataformas como Render/Fly.io quando o
# Oracle FIAP não está acessível fora da rede da faculdade.
# Para ativar: defina a variável de ambiente SPRING_PROFILES_ACTIVE=h2
# ------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:xaelordb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
