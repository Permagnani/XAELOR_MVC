<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${modoEdicao} ? 'Editar matéria-prima' : 'Nova matéria-prima')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main>
  <a th:href="@{/materias-primas}" class="btn btn-ghost btn-sm">&larr; Voltar</a>
  <h1 th:text="${modoEdicao} ? 'Editar matéria-prima' : 'Nova matéria-prima'">Nova matéria-prima</h1>

  <form class="xa-form"
        th:action="${modoEdicao} ? @{/materias-primas/{id}/editar(id=${materiaPrima.id})} : @{/materias-primas}"
        th:object="${materiaPrima}" method="post">

    <div class="xa-field">
      <label for="nome">Nome</label>
      <input id="nome" type="text" th:field="*{nome}" placeholder="Ex: Óleo essencial de sândalo"/>
      <div class="xa-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
    </div>

    <div class="xa-field">
      <label for="tipoUnidade">Tipo de unidade</label>
      <select id="tipoUnidade" th:field="*{tipoUnidade}">
        <option th:each="tipo : ${tiposUnidade}" th:value="${tipo}" th:text="${tipo}"></option>
      </select>
      <div class="xa-error" th:if="${#fields.hasErrors('tipoUnidade')}" th:errors="*{tipoUnidade}"></div>
    </div>

    <div class="xa-field">
      <label for="descricao">Descrição</label>
      <textarea id="descricao" rows="3" th:field="*{descricao}" placeholder="Origem, fornecedor, características..."></textarea>
    </div>

    <div class="xa-form-actions">
      <button type="submit" class="btn btn-primary" th:text="${modoEdicao} ? 'Salvar alterações' : 'Cadastrar matéria-prima'">Salvar</button>
      <a th:href="@{/materias-primas}" class="btn btn-ghost">Cancelar</a>
    </div>
  </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
