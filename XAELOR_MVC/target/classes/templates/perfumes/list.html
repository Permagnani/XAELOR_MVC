<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Perfumes')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div th:if="${mensagem}" class="xa-flash" th:text="${mensagem}"></div>

<main>
  <div class="xa-section-head">
    <div>
      <div class="eyebrow-line" style="color:var(--xa-wine-soft);font-size:0.8rem;letter-spacing:0.2em;">CATÁLOGO</div>
      <h1>Perfumes</h1>
    </div>
    <a sec:authorize="isAuthenticated()" th:href="@{/perfumes/novo}" class="btn btn-primary">+ Novo perfume</a>
  </div>

  <div th:if="${#lists.isEmpty(perfumes)}" class="xa-empty">
    Nenhum perfume cadastrado ainda.
    <div style="margin-top:1rem;">
      <a sec:authorize="isAuthenticated()" th:href="@{/perfumes/novo}" class="btn btn-wine">Cadastrar o primeiro perfume</a>
    </div>
  </div>

  <div class="xa-grid" th:unless="${#lists.isEmpty(perfumes)}">
    <div class="xa-card" th:each="perfume : ${perfumes}">
      <span class="tag" th:text="${perfume.generoPerfume}">Gênero</span>
      <h3 th:text="${perfume.nomePerfume}">Nome do perfume</h3>
      <p th:if="${perfume.descricaoPerfume}" th:text="${perfume.descricaoPerfume}">Descrição</p>
      <div class="price" th:if="${perfume.preco != null}" th:text="'R$ ' + ${#numbers.formatDecimal(perfume.preco, 1, 2)}">R$ 0,00</div>
      <div class="xa-card-actions">
        <a th:href="@{/perfumes/{id}(id=${perfume.id})}" class="btn btn-sm">Detalhes</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/perfumes/{id}/editar(id=${perfume.id})}" class="btn btn-sm btn-ghost">Editar</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/perfumes/{id}/deletar(id=${perfume.id})}" method="post" style="display:inline"
              onsubmit="return confirm('Remover este perfume?');">
          <button type="submit" class="btn btn-sm btn-wine">Excluir</button>
        </form>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
