<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ops')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main>
  <div class="xa-empty">
    <h2>Algo não saiu como o esperado</h2>
    <p th:if="${status}" th:text="'Código: ' + ${status}">Código</p>
    <p th:if="${error}" th:text="${error}">Erro</p>
    <div style="margin-top:1.5rem;">
      <a th:href="@{/}" class="btn btn-primary">Voltar para o início</a>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
