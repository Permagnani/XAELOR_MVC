spring.application.name=XAELOR_MVC

# Porta do Tomcat
server.port=${PORT:8083}

# ------------------------------------------------------------------
# Banco de dados - Oracle FIAP (mesmo banco utilizado na Parte I)
# As credenciais vêm de variáveis de ambiente para não ficarem expostas
# no GitHub. Para rodar localmente, configure as variáveis abaixo ou
# troque os valores default pelos seus dados do Oracle FIAP.
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:rm563379}
spring.datasource.password=${DB_PASSWORD:180107}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf - facilita o desenvolvimento (desative em produção se quiser cache)
spring.thymeleaf.cache=false

# Usuário e senha do login da aplicação (rotas privadas)
app.security.admin-user=${ADMIN_USER:admin}
app.security.admin-password=${ADMIN_PASSWORD:admin123}
